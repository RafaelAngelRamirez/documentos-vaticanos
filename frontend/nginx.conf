server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # Large installers (APK / AppImage / NSIS)
    client_max_body_size 512m;

    # SPA: real files first (incl. /downloads/*), else index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicit downloads: no SPA fallback, long cache for stable filenames
    location /downloads/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream AppImage;
            application/octet-stream exe;
            application/json json;
        }
        default_type application/octet-stream;
    }

    # Do not cache the SPA shell aggressively
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
