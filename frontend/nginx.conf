server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # Large installers (APK / AppImage / NSIS)
    client_max_body_size 512m;

    # SPA: real files first (incl. /downloads/*), else index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicit downloads: no SPA fallback, long cache for stable filenames.
    # CORS: Capacitor (https://localhost) and Electron (http://127.0.0.1:*)
    # fetch the remote manifest for update checks from non-same-origin shells.
    location /downloads/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Accept, Content-Type";
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Accept, Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream AppImage;
            application/octet-stream exe;
            application/json json;
        }
        default_type application/octet-stream;
    }

    # Do not cache the SPA shell aggressively
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
