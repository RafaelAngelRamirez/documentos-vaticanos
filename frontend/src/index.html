<!doctype html>
<html lang="es">
  <head>
    <base href="/">
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#161616">
    <link rel="manifest" href="manifest.webmanifest">
    <script>
      // Tema antes del primer paint (evita flash claro en la WebView/APK).
      // Réplica mínima de ReaderPreferencesService: default 'mono',
      // migración paper→mono / night→oscuro, 'system' via prefers-color-scheme.
      (function () {
        var theme = 'mono';
        try {
          var raw = localStorage.getItem('reader.prefs.v1');
          if (raw) {
            var t = (JSON.parse(raw) || {}).theme;
            t = { paper: 'mono', night: 'oscuro' }[t] || t;
            if (['mono', 'claro', 'sepia', 'oscuro', 'system'].indexOf(t) >= 0) {
              theme = t;
            }
          }
        } catch (e) { /* private mode / JSON corrupto: default mono */ }
        var resolved = theme;
        if (theme === 'system') {
          resolved =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'oscuro'
              : 'claro';
        }
        var root = document.documentElement;
        root.setAttribute('data-reader-theme', theme);
        root.setAttribute('data-reader-resolved', resolved);
        var bg = {
          mono: '#161616',
          claro: '#fdfdfb',
          sepia: '#f8f1de',
          oscuro: '#201c15',
        }[resolved];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && bg) meta.content = bg;
      })();
    </script>

    <title>Documentos Vaticanos</title>
    <!-- Fuentes empaquetadas vía @fontsource (angular.json > styles); sin CDN para que la APK funcione offline. -->
</head>
  <body class="app-surface">
    <app-root></app-root>
    <noscript>Javascript es necesario</noscript>
  </body>
</html>
