<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a
      class="navbar-brand"
      href="#"
    >Documentos Vaticanos</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div
      class="collapse navbar-collapse"
      id="navbarSupportedContent"
    >
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            aria-current="page"
            href="javascript:void(0)"
          >v{{version}}</a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link active"
            aria-current="page"
            href="javascript:void(0)"
            (click)="navigate_to_beginning()"
          >Inicio</a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            href="javascript:void(0)"
            (click)="navigate_to_documents()"
          >Listar documentos</a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            href="javascript:void(0)"
            (click)="navigate_to_about()"
          >Acerca de</a>
        </li>
      </ul>
      <form
        [formGroup]="form"
        class="d-flex align-items-center gap-2"
      >
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm navbar-theme-btn"
          (click)="cycleTheme()"
          [title]="themeTitle()"
          aria-label="Cambiar tema de lectura"
        >
          <span *ngIf="prefs.theme === 'night'">☾</span>
          <span *ngIf="prefs.theme === 'sepia'">◐</span>
          <span *ngIf="prefs.theme === 'paper'">☀</span>
          <span *ngIf="prefs.theme === 'system'">◌</span>
        </button>
        <input
          formControlName="buscador"
          class="form-control me-2"
          type="search"
          placeholder="Ingresa terminos separados por coma"
          aria-label="Search"
        />
        <button
          class="btn btn-outline-success"
          type="submit"
        >Buscar</button>
      </form>
    </div>
  </div>
</nav>
