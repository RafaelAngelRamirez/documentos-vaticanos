<nav class="app-nav" aria-label="Principal">
  <div class="app-nav-inner">
    <a
      class="app-nav-brand"
      href="javascript:void(0)"
      (click)="navigate_to_beginning()"
      >Documentos Vaticanos</a
    >

    <button
      type="button"
      class="app-nav-toggle"
      (click)="menuOpen = !menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-controls="app-nav-menu"
      aria-label="Menú"
    >
      <span aria-hidden="true">☰</span>
    </button>

    <div
      id="app-nav-menu"
      class="app-nav-menu"
      [class.is-open]="menuOpen"
    >
      <ul class="app-nav-links">
        <li>
          <a href="javascript:void(0)" (click)="navigate_to_beginning(); closeMenu()"
            >Inicio</a
          >
        </li>
        <li>
          <a href="javascript:void(0)" (click)="navigate_to_documents(); closeMenu()"
            >Documentos</a
          >
        </li>
        <li>
          <a href="javascript:void(0)" (click)="navigate_to_studies(); closeMenu()"
            >Estudios</a
          >
        </li>
        <li>
          <a href="javascript:void(0)" (click)="navigate_to_about(); closeMenu()"
            >Acerca de</a
          >
        </li>
        <li>
          <a href="javascript:void(0)" (click)="navigate_to_account(); closeMenu()"
            >{{ auth.user ? auth.user.name || 'Cuenta' : 'Cuenta' }}</a
          >
        </li>
        <li class="app-nav-version" aria-hidden="true">v{{ version }}</li>
      </ul>

      <form [formGroup]="form" class="app-nav-search" (ngSubmit)="$event.preventDefault()">
        <button
          type="button"
          class="app-btn app-btn-sm navbar-theme-btn"
          (click)="cycleTheme()"
          [title]="themeTitle()"
          aria-label="Cambiar tema de lectura"
        >
          <span *ngIf="prefs.theme === 'night'">☾</span>
          <span *ngIf="prefs.theme === 'sepia'">◐</span>
          <span *ngIf="prefs.theme === 'paper'">☀</span>
          <span *ngIf="prefs.theme === 'system'">◌</span>
        </button>
        <input
          formControlName="buscador"
          class="app-search-input app-nav-input"
          type="search"
          placeholder="Términos o puntos, separados por coma"
          aria-label="Buscar"
        />
      </form>
    </div>
  </div>
</nav>
