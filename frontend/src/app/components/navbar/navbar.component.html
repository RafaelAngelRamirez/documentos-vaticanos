<header class="wbar desktop-wbar" role="banner">
  <span class="wmark">DV</span>
  <span class="wname">{{ t('app.name') }}</span>
  <button type="button" class="wlink" [class.on]="active === 'inicio'" (click)="navigate_to_beginning()">
    {{ t('nav.home') }}
  </button>
  <button type="button" class="wlink" [class.on]="active === 'biblioteca'" (click)="navigate_to_documents()">
    {{ t('nav.library') }}
  </button>
  <button type="button" class="wlink" [class.on]="active === 'about'" (click)="navigate_to_about()">
    {{ t('nav.about') }}
  </button>
  <input
    class="wsearch"
    type="search"
    [formControl]="control_buscador"
    [attr.placeholder]="t('inicio.search_hint')"
    [attr.aria-label]="t('inicio.search_hint')"
  />
</header>

<div class="fbar hair only-mobile">
  <span class="ftitle">{{ title }}</span>
  <span class="fs12 muted">v{{ version }}</span>
</div>
