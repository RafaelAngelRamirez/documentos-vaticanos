<!-- Chrome for secondary routes only (cuenta, estudios, about). Reading IA has no global nav. -->
<nav class="dv-app-nav hair" aria-label="Principal">
  <div class="dv-app-nav-inner">
    <a
      class="dv-app-brand"
      href="javascript:void(0)"
      (click)="navigate_to_beginning()"
      >Documentos Vaticanos</a
    >

    <button
      type="button"
      class="dv-app-toggle"
      (click)="menuOpen = !menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-controls="dv-app-menu"
      aria-label="Menú"
    >
      ☰
    </button>

    <div id="dv-app-menu" class="dv-app-menu" [class.is-open]="menuOpen">
      <ul class="dv-app-links">
        <li>
          <a href="javascript:void(0)" (click)="navigate_to_beginning(); closeMenu()"
            >Inicio</a
          >
        </li>
        <li>
          <a href="javascript:void(0)" (click)="navigate_to_documents(); closeMenu()"
            >Biblioteca</a
          >
        </li>
        <li>
          <a href="javascript:void(0)" (click)="navigate_to_studies(); closeMenu()"
            >Estudios</a
          >
        </li>
        <li>
          <a href="javascript:void(0)" (click)="navigate_to_about(); closeMenu()"
            >Acerca de</a
          >
        </li>
        <li>
          <a href="javascript:void(0)" (click)="navigate_to_account(); closeMenu()"
            >{{ auth.user ? auth.user.name || 'Cuenta' : 'Cuenta' }}</a
          >
        </li>
      </ul>
      <button
        type="button"
        class="app-btn app-btn-sm"
        (click)="cycleTheme()"
        [title]="themeTitle()"
        aria-label="Cambiar tema"
      >
        <span *ngIf="prefs.theme === 'night'">☾</span>
        <span *ngIf="prefs.theme === 'sepia'">◐</span>
        <span *ngIf="prefs.theme === 'paper'">☀</span>
        <span *ngIf="prefs.theme === 'system'">◌</span>
      </button>
    </div>
  </div>
</nav>
