<div *ngIf="loading_docs" class="alert alert-info my-3" role="status">
  Cargando documentos para la búsqueda…
</div>

<div *ngIf="load_error" class="alert alert-danger my-3" role="alert">
  {{ load_error }}
</div>

<ng-container *ngFor="let doc_resultado of docs_resultados">
  <h2>{{doc_resultado.doc.nombre}}</h2>
  <span class="text-small text-muted">
    {{doc_resultado.puntos.length}} resultados encontrados.
  </span>


  <ng-container *ngFor="let punto of doc_resultado.puntos_paginados">


    <app-punto [infoPunto]="punto"></app-punto>

    <div class="row">
      <div class="col-12 ">
        <button
          class="btn btn-small btn-info btn-rounded"
          (click)="navigate_to_read(punto, doc_resultado)"
        >

          <i
            class="fa fa-eye"
            aria-hidden="true"
          ></i>

        </button>
      </div>
    </div>


  </ng-container>

  <ng-container *ngTemplateOutlet="paginator"></ng-container>
  <ng-template #paginator>

    <mat-paginator
      *ngIf="doc_resultado.puntos.length"
      [length]="doc_resultado.puntos.length"
      [pageSize]="page_size"
      [pageSizeOptions]="page_size_options"
      (page)="handlePageEvent($event, doc_resultado)"
      aria-label="Select page"
    >
    </mat-paginator>
  </ng-template>

</ng-container>
