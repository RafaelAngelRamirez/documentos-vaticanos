<div class="reader-surface">
  <header class="reader-chrome">
    <div class="reader-chrome-inner">
      <div class="reader-chrome-left">
        <button
          type="button"
          class="reader-btn reader-btn-ghost"
          (click)="goToSearch()"
          title="Volver a la búsqueda"
        >
          ← Buscar
        </button>
        <button
          *ngIf="navigationService.canGoBack()"
          type="button"
          class="reader-btn reader-btn-ghost"
          (click)="goBackFromRef()"
          title="Volver a la cita anterior"
        >
          ← Cita
        </button>
      </div>

      <div class="reader-chrome-title" [attr.title]="documentTitle">
        {{ documentTitle }}
      </div>

      <div class="reader-chrome-right">
        <button
          type="button"
          class="reader-btn reader-btn-aa"
          [class.active]="prefsOpen"
          (click)="togglePrefs()"
          title="Preferencias de lectura"
          aria-label="Preferencias de lectura"
          [attr.aria-expanded]="prefsOpen"
        >
          Aa
        </button>
      </div>
    </div>

    <div *ngIf="prefsOpen" class="reader-prefs" role="region" aria-label="Preferencias de lectura">
      <div class="reader-prefs-row">
        <span class="reader-prefs-label">Tamaño</span>
        <button type="button" class="reader-btn" (click)="decreaseFont()" title="Reducir tamaño">
          A−
        </button>
        <span class="reader-prefs-value">{{ prefs.fontSizePx }}px</span>
        <button type="button" class="reader-btn" (click)="increaseFont()" title="Aumentar tamaño">
          A+
        </button>
      </div>

      <div class="reader-prefs-row">
        <span class="reader-prefs-label">Tema</span>
        <button type="button" class="reader-btn" (click)="cycleTheme()">
          {{ themeLabel(prefs.theme) }}
        </button>
      </div>

      <div class="reader-prefs-row">
        <span class="reader-prefs-label">Fuente</span>
        <button type="button" class="reader-btn" (click)="cycleFont()">
          {{ fontLabel(prefs.font) }}
        </button>
      </div>

      <div class="reader-prefs-row reader-prefs-meta">
        <span>Interlineado {{ prefs.lineHeight }} · Ancho {{ prefs.maxWidthCh }}ch</span>
        <button type="button" class="reader-btn reader-btn-ghost" (click)="resetPrefs()">
          Restablecer
        </button>
      </div>
    </div>
  </header>

  <div class="reader-measure">
    <div *ngIf="loading" class="reader-status" role="status">
      Cargando documento…
    </div>

    <div *ngIf="load_error" class="reader-status reader-status-error" role="alert">
      {{ load_error }}
    </div>

    <ng-container *ngIf="!loading && document">
      <div class="reader-load-link" *ngIf="canLoadBefore">
        <a href="javascript:void(0)" (click)="load_before()">
          ↑ Cargar {{ quantity_to_load }} anteriores
        </a>
      </div>
      <div class="reader-load-link reader-load-muted" *ngIf="!canLoadBefore">
        Inicio del documento
      </div>

      <div class="reader-content">
        <app-punto
          *ngFor="let article of actual_articles"
          [infoPunto]="article"
        ></app-punto>
      </div>

      <div class="reader-load-link" *ngIf="canLoadNext">
        <a href="javascript:void(0)" (click)="load_next()">
          ↓ Cargar {{ quantity_to_load }} siguientes
        </a>
      </div>
      <div class="reader-load-link reader-load-muted" *ngIf="!canLoadNext">
        Fin del documento
      </div>
    </ng-container>
  </div>
</div>
