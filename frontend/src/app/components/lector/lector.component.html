<div class="app t-current">
  <div class="topbar hair fx ac jb">
    <button type="button" class="back" (click)="goToLibrary()">← Buscar</button>
    <div class="ttl" [attr.title]="documentTitle">{{ documentTitle }}</div>
    <button
      type="button"
      class="btn f-serif"
      style="padding: 6px 12px; min-height: 36px"
      (click)="togglePrefs()"
      [attr.aria-expanded]="prefsOpen"
    >
      Aa
    </button>
  </div>

  <div *ngIf="prefsOpen" class="panel">
    <div class="prow">
      <span class="plabel">Tamaño</span>
      <button type="button" class="btn" (click)="decreaseFont()">A−</button>
      <span class="fs14">{{ prefs.fontSizePx }}px</span>
      <button type="button" class="btn" (click)="increaseFont()">A+</button>
    </div>
    <div class="prow">
      <span class="plabel">Tema</span>
      <button type="button" class="btn" (click)="cycleTheme()">
        {{ themeLabel(prefs.theme) }}
      </button>
    </div>
    <div class="prow">
      <span class="plabel">Fuente</span>
      <button type="button" class="btn" (click)="cycleFont()">
        {{ fontLabel(prefs.font) }}
      </button>
    </div>
    <div class="prow fx jb">
      <span class="fs13 muted"
        >Interlineado {{ prefs.lineHeight }} · Ancho {{ prefs.maxWidthCh }}ch</span
      >
      <button type="button" class="back fs13" (click)="resetPrefs()">
        Restablecer
      </button>
    </div>
    <div class="prow" *ngIf="navigationService.canGoBack()">
      <button type="button" class="back" (click)="goBackFromRef()">
        ← Cita anterior
      </button>
    </div>
  </div>

  <div class="reader">
    <div *ngIf="loading" class="rstart">Cargando documento…</div>
    <div *ngIf="load_error" class="rstart" style="color: #8b3a3a">
      {{ load_error }}
    </div>

    <ng-container *ngIf="!loading && document">
      <div class="rstart" *ngIf="canLoadBefore">
        <a href="javascript:void(0)" class="muted" (click)="load_before()"
          >↑ Cargar {{ quantity_to_load }} anteriores</a
        >
      </div>
      <div class="rstart" *ngIf="!canLoadBefore">Inicio del documento</div>

      <div
        class="rdoc"
        [class.f-serif]="prefs.font === 'serif'"
        [style.font-size.px]="prefs.fontSizePx"
        [style.max-width]="prefs.maxWidthCh + 'ch'"
      >
        <app-punto
          *ngFor="let article of actual_articles"
          [infoPunto]="article"
          [documentId]="document?.id || navigationService.document_id || undefined"
        ></app-punto>
      </div>

      <div class="rend" *ngIf="canLoadNext">
        <a href="javascript:void(0)" class="muted" (click)="load_next()"
          >↓ Cargar {{ quantity_to_load }} siguientes</a
        >
      </div>
      <div class="rend" *ngIf="!canLoadNext">· · ·</div>
    </ng-container>
  </div>
</div>
