<ng-container *ngIf="infoPunto?.article">
  <div class="punto-header">
    <h5 class="card-title">
      {{ obtener_consecutivo(infoPunto.article.consecutivo) }}
      <span *ngIf="infoPunto.article.biblia" class="punto-bible-label">
        {{ infoPunto.article.biblia.consecutivo_versiculo }}
      </span>
    </h5>
    <div class="punto-actions">
      <button
        *ngIf="canSave"
        type="button"
        class="btn btn-link btn-sm punto-save-btn"
        (click)="saveReference($event)"
        title="Guardar referencia personal"
      >
        ★
      </button>
      <span *ngIf="saveMsg" class="punto-save-msg">{{ saveMsg }}</span>
      <span *ngIf="saveError" class="punto-save-err">{{ saveError }}</span>
      <button
        *ngIf="showDebugToggle"
        type="button"
        class="btn btn-link btn-sm punto-raw-toggle"
        (click)="toggleRaw($event)"
        title="Ver JSON crudo"
        aria-label="Ver JSON crudo"
      >
        <i class="fa fa-bug" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <p class="punto-contenido">
    <ng-container *ngFor="let seg of segments">
      <span *ngIf="seg.type === 'text'" [innerHTML]="seg.html"></span>
      <a
        *ngIf="seg.type === 'ref' && seg.local"
        href="javascript:void(0)"
        class="ref-link"
        [attr.title]="seg.label"
        (click)="openRef(seg, $event)"
        >{{ seg.label }}</a
      >
      <span
        *ngIf="seg.type === 'ref' && !seg.local"
        class="ref-unresolved"
        title="Sin destino offline"
        >{{ seg.label }}</span
      >
    </ng-container>
  </p>

  <pre *ngIf="ver_raw" class="punto-raw">{{ infoPunto | json }}</pre>
</ng-container>
