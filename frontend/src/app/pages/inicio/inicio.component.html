<div class="app welcome">
  <div class="wbody" *ngIf="first_view()">
    <div class="mark">DV</div>
    <h1 class="wtitle serif">{{ t('inicio.title') }}</h1>
    <p class="fs14 muted wlede">{{ t('inicio.lede') }}</p>

    <input
      class="field"
      type="search"
      [formControl]="search"
      [attr.placeholder]="t('inicio.search_hint')"
      [attr.aria-label]="t('inicio.search_hint')"
    />
    <p class="fs12 muted search-hint">{{ t('inicio.search_hint') }}</p>

    <button type="button" class="primary wbtn" (click)="goLibrary()">
      {{ t('inicio.start') }}
    </button>

    <div class="home-docs" *ngIf="featured.length">
      <div class="sect">Leer u oír</div>
      <div class="bookcard" *ngFor="let row of featured">
        <span class="bkind">{{ row.kindLine }}</span>
        <span class="bt">{{ row.title }}</span>
        <span class="bm" *ngIf="row.sourceNote">{{ row.sourceNote }}</span>
        <div class="fx gap8" style="margin-top: 12px">
          <button type="button" class="primary" style="margin: 0" (click)="openCover(row.doc)">
            {{ t('library.read') }}
          </button>
        </div>
        <button type="button" class="gbtn listen" (click)="listen(row.doc)">
          {{ t('library.listen') }}
        </button>
      </div>
    </div>
  </div>

  <div class="fbody" *ngIf="!first_view()">
    <div class="sect">Resultados</div>
    <app-buscador></app-buscador>
  </div>
</div>
