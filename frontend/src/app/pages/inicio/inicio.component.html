<!-- Design: view "inicio" — portada sin chrome ni búsqueda -->
<div class="dv-home">
  <p class="dv-eyebrow">Biblioteca de lectura</p>
  <h1 class="dv-h1">Documentos Vaticanos</h1>
  <p class="dv-lede">
    Los grandes textos del magisterio de la Iglesia — concilios, encíclicas,
    exhortaciones y el Catecismo — reunidos en un solo lugar, para leer con
    calma.
  </p>
  <button type="button" class="dv-btnacc" (click)="goDocuments()">
    Abrir la biblioteca
  </button>
  <div class="dv-rule" aria-hidden="true"></div>
  <p class="dv-homefoot">
    Lectura sin distracciones · Tamaño, tema y fuente ajustables · Funciona sin
    conexión
  </p>
</div>
