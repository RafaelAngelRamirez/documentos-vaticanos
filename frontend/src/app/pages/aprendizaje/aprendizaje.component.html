<div class="app-product web-shell has-bnav" [attr.data-tick]="localeTick">
  <app-wbar></app-wbar>
  <div class="only-mobile">
    <app-fbar [title]="t('learning.title')"></app-fbar>
  </div>
  <div class="fbody">
    <div class="sect" style="margin-top: 0">{{ t('clase.learning_list') }}</div>
    <p class="fs13 muted" *ngIf="aviso">{{ aviso }}</p>

    <ng-container *ngIf="copias.length; else vacio">
      <div class="card clase-card" *ngFor="let c of copias" data-testid="clase-copia">
        <button type="button" class="clase-open" (click)="abrir(c)">
          <div class="serif fw6" style="font-size: 20px">{{ c.clase.titulo }}</div>
          <div class="fs13 muted">
            <span *ngIf="c.clase.audiencia === 'publica'">{{ t('clase.audience_public') }} · </span>
            {{ t('clase.revision', { n: c.clase.revision }) }}
            · {{ t('clase.progress', { done: hechos(c), total: c.clase.pasos.length }) }}
          </div>
          <div class="prog">
            <div class="progfill" [style.width.%]="pct(c)"></div>
          </div>
        </button>
        <button
          type="button"
          class="primary"
          *ngIf="c.clase.pasos.length"
          (click)="continuar(c)"
        >
          {{ t('clase.continue') }}
        </button>
      </div>
    </ng-container>

    <ng-template #vacio>
      <p class="fs13" data-testid="clase-vacio">{{ t('clase.empty') }}</p>
      <p class="fs13 muted">{{ t('clase.empty_invite') }}</p>
    </ng-template>

    <label class="gbtn clase-import">
      {{ t('clase.import') }}
      <input data-testid="clase-import" type="file" accept="application/json,.json,.dv-clase.json" (change)="onFile($event)" />
    </label>

    <a *ngIf="apiEnabled" routerLink="/estudios" class="gbtn clase-link">{{ t('clase.catalog') }}</a>
  </div>

  <app-bnav></app-bnav>
</div>
