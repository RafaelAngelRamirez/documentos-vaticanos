<div class="app-page">
  <header class="app-page-head">
    <h1 class="app-page-title">Mis referencias</h1>
    <a routerLink="/cuenta" class="app-btn-link">← Cuenta</a>
  </header>

  <div *ngIf="loading" class="app-muted">Cargando…</div>
  <div *ngIf="error" class="app-status app-status-error">{{ error }}</div>

  <div *ngIf="!loading && !items.length" class="app-muted app-fs14">
    Aún no tienes referencias. Abre un documento y usa ★ Guardar.
  </div>

  <ul class="app-list">
    <li *ngFor="let item of items" class="app-list-item">
      <div class="app-list-body" style="cursor: pointer" (click)="open(item)">
        <div class="app-list-name">
          {{ item.unitLabel || item.documentId + ' #' + item.unitIndex }}
        </div>
        <div class="app-list-meta">
          {{ item.documentId }} · índice {{ item.unitIndex }}
        </div>
        <div *ngIf="item.note" class="app-fs13" style="margin-top: 4px">
          {{ item.note }}
        </div>
      </div>
      <button type="button" class="app-btn app-btn-sm app-btn-danger" (click)="remove(item)">
        Quitar
      </button>
    </li>
  </ul>
</div>
