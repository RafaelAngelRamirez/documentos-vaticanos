<div class="app has-bnav web-shell" [attr.data-tick]="localeTick">
  <app-wbar active="padres"></app-wbar>
  <div class="only-mobile">
    <app-fbar [title]="t('parents.title')"></app-fbar>
  </div>

  <div class="fbody padres-body">
    <h2 class="h2 only-desktop">{{ t('parents.title') }}</h2>
    <div class="fs14 muted" style="line-height: 1.6; max-width: 70ch">
      {{ t('parents.lede') }}
      También en
      <a routerLink="/papas" class="app-lang-link">Papas</a>,
      <a routerLink="/doctores" class="app-lang-link">Doctores</a>
      y en el
      <a routerLink="/santoral" class="app-lang-link">Santoral</a>
      (biografías de la Santa Sede y autores del corpus).
    </div>

    <app-era-list [groups]="groups" (open)="open($event)"></app-era-list>
  </div>

  <app-bnav></app-bnav>
</div>
