<div class="row">
  <div class="col-12 mt-3">
    <div
      *ngFor="let item of docService.documentos_disponibles"
      class="card shadow"
    >
      <div class="card-body">
        <h1 class="card-title"><i class="fas fa-book-open"></i>
          {{item.nombre}}</h1>
        <p class="card-text">
          Palabras indexadas: {{keys(item.indice.indice).length | number}}
        </p>
        <a
          (click)="read(item)"
          href="javascript:void(0)"
          class="btn btn-sm btn-secondary"
        >Leer desde el inicio </a>
      </div>
    </div>
  </div>
</div>
