<!-- Design: view "biblioteca" -->
<div class="dv-lib-page">
  <header class="dv-topbar hair">
    <button type="button" class="dv-back" (click)="goHome()">← Inicio</button>
    <div class="dv-ttl">Biblioteca</div>
    <div class="dv-topbar-spacer" aria-hidden="true"></div>
  </header>

  <div class="dv-lib">
    <input
      class="dv-search"
      type="search"
      placeholder="Buscar por título o autor…"
      [value]="query"
      (input)="onQuery($event)"
      aria-label="Buscar por título o autor"
    />

    <div *ngIf="loading" class="dv-empty" role="status">Cargando documentos…</div>
    <div *ngIf="load_error" class="dv-empty dv-error" role="alert">
      {{ load_error }}
    </div>

    <ng-container *ngIf="!loading && !load_error">
      <button
        type="button"
        class="dv-docrow"
        *ngFor="let item of filtered"
        (click)="read(item)"
      >
        <div class="dv-docrow-body">
          <div class="dv-dt">{{ displayTitle(item) }}</div>
          <div class="dv-dm">
            {{ metaLine(item) }}
            <ng-container *ngIf="sourceUrl(item) as href">
              ·
              <a
                class="dv-lang"
                [href]="href"
                target="_blank"
                rel="noopener noreferrer"
                (click)="$event.stopPropagation()"
                >{{ localeLabel(item) }}</a
              >
            </ng-container>
          </div>
        </div>
        <span class="dv-chev" aria-hidden="true">›</span>
      </button>

      <div *ngIf="sinResultados" class="dv-empty">
        Ningún documento coincide con la búsqueda.
      </div>

      <p class="dv-lib-foot">
        <a href="javascript:void(0)" (click)="goFullTextSearch()">Buscar en el texto</a>
        de todos los documentos ·
        <a href="javascript:void(0)" (click)="goAccount()">Cuenta</a>
      </p>
    </ng-container>
  </div>
</div>
