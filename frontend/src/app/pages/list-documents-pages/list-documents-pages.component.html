<div class="app has-bnav web-shell">
  <app-wbar active="biblioteca"></app-wbar>

  <!-- 3D móvil -->
  <div class="only-mobile">
    <app-fbar [title]="t('library.title')"></app-fbar>
    <div class="lib">
      <input
        class="field"
        type="search"
        [attr.placeholder]="t('library.search_placeholder')"
        [value]="query"
        (input)="onQuery($event)"
        [attr.aria-label]="t('library.search_placeholder')"
      />
      <div class="tabs" role="tablist" aria-label="Filtrar por tipo">
        <button
          type="button"
          class="tab"
          role="tab"
          *ngFor="let t of tabs"
          [class.on]="activeTab === t"
          [attr.aria-selected]="activeTab === t"
          (click)="setTab(t)"
        >
          {{ t }}
        </button>
      </div>
      <div *ngIf="loading" class="empty" role="status">{{ t('library.loading') }}</div>
      <div *ngIf="load_error" class="empty" role="alert">{{ load_error }}</div>
      <ng-container *ngIf="!loading && !load_error">
        <button type="button" class="srow" *ngFor="let item of filtered" (click)="open(item)">
          <span class="st">{{ displayTitle(item) }}</span>
          <span class="sx">{{ metaLine(item) }}</span>
        </button>
        <div *ngIf="sinResultados" class="empty">
          Ningún documento coincide con la búsqueda.
        </div>
      </ng-container>
    </div>
    <app-bnav current="biblioteca"></app-bnav>
  </div>

  <!-- 5B web -->
  <div class="wmain only-desktop">
    <aside class="wside" aria-label="Filtros de biblioteca">
      <button
        type="button"
        class="sitem"
        *ngFor="let t of sideTabs"
        [class.on]="activeTab === t"
        (click)="setTab(t)"
      >
        {{ t }}
      </button>
      <div class="sect" style="margin: 22px 12px 8px">Mi lectura</div>
      <button type="button" class="sitem" (click)="goContinue()">
        Continuar
        <ng-container *ngIf="lastReadLabel"> · {{ lastReadLabel }}</ng-container>
      </button>
      <a routerLink="/notas" class="sitem">Marcadores</a>
      <a routerLink="/notas" class="sitem">Mis notas</a>
    </aside>
    <div class="wbody">
      <div class="fx ac jb" style="margin-bottom: 18px">
        <h2 class="h2">{{ t('library.title') }}</h2>
        <span class="fs13 muted">{{ t('library.doc_count_offline', { n: docCount }) }}</span>
      </div>
      <div *ngIf="loading" class="fs13 muted">{{ t('common.loading') }}</div>
      <div *ngIf="load_error" class="fs13" style="color: #b0563a">{{ load_error }}</div>
      <div class="cardgrid" *ngIf="!loading && !load_error">
        <button
          type="button"
          class="bookcard"
          *ngFor="let item of filtered"
          (click)="open(item)"
        >
          <span class="bkind">{{ kindOf(item) }}</span>
          <span class="bt">{{ displayTitle(item) }}</span>
          <span class="bm">{{ metaLine(item) }}</span>
          <div class="prog" *ngIf="progressOf(item) as pct">
            <div class="progfill" [style.width.%]="pct"></div>
          </div>
        </button>
      </div>
      <div *ngIf="sinResultados" class="fs13 muted" style="margin-top: 16px">
        Ningún documento coincide con el filtro.
      </div>
    </div>
  </div>
</div>
