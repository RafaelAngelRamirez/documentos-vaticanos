<div class="app t-current">
  <div class="topbar hair fx ac jb">
    <button type="button" class="back" (click)="goHome()">← Inicio</button>
    <div class="ttl">Biblioteca</div>
    <div style="width: 52px" aria-hidden="true"></div>
  </div>

  <div class="lib">
    <input
      class="search"
      type="search"
      placeholder="Buscar por título o autor…"
      [value]="query"
      (input)="onQuery($event)"
      aria-label="Buscar por título o autor"
    />

    <div *ngIf="loading" class="empty" role="status">Cargando documentos…</div>
    <div *ngIf="load_error" class="empty" role="alert">{{ load_error }}</div>

    <ng-container *ngIf="!loading && !load_error">
      <button
        type="button"
        class="docrow"
        *ngFor="let item of filtered"
        (click)="read(item)"
      >
        <div class="f1">
          <div class="dt">{{ displayTitle(item) }}</div>
          <div class="dm">{{ metaLine(item) }}</div>
        </div>
        <span class="chev" aria-hidden="true">›</span>
      </button>

      <div *ngIf="sinResultados" class="empty">
        Ningún documento coincide con la búsqueda.
      </div>
    </ng-container>
  </div>
</div>
