<app-person-ficha
  *ngIf="padre as p"
  wbarActive="padres"
  backLink="/padres"
  backLabel="← Padres"
  [kindLine]="kindLine"
  [title]="p.name"
  [subtitle]="p.role"
  [quote]="p.quote"
  [quoteSource]="p.quoteSource"
  [quoteCite]="quoteCite"
  [works]="works"
  [themes]="p.themes"
  (quoteOpen)="openCite($event)"
  (citeOpen)="openCite($event)"
>
  <div ficha-after-quote>
    <p
      *ngIf="citeStatus"
      class="fs12 muted"
      data-testid="padre-cite-progress"
    >
      {{ citeStatus }}
    </p>
    <app-pasaje
      *ngIf="pasajeVerses.length"
      data-testid="padre-pasaje"
      [verses]="pasajeVerses"
      [label]="pasajeLabel"
    ></app-pasaje>
    <app-reading-ctas
      *ngIf="primaryWorkId"
      layout="stack"
      [canContinue]="false"
      [showRestart]="false"
      startLabel="Comenzar la lectura"
      (start)="openPrimaryWork(false)"
      (listen)="openPrimaryWork(true)"
    ></app-reading-ctas>
    <app-historical-context-block
      *ngIf="historicalContext"
      [ctx]="historicalContext"
      sectionTitle="Contexto histórico"
    ></app-historical-context-block>
  </div>
</app-person-ficha>
