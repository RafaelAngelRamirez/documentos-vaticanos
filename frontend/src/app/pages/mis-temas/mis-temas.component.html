<div class="app-page">
  <header class="app-page-head">
    <h1 class="app-page-title">Mis temas</h1>
    <a routerLink="/cuenta" class="app-btn-link">← Cuenta</a>
  </header>

  <div *ngIf="error" class="app-status app-status-error">{{ error }}</div>

  <form [formGroup]="form" (ngSubmit)="create()" class="app-card" style="margin-bottom: 1.5rem">
    <h2 class="app-section-title" style="margin-top: 0">Nuevo tema</h2>
    <div class="app-field-group">
      <input class="app-field" formControlName="title" placeholder="Título del tema" />
    </div>
    <div class="app-field-group">
      <textarea
        class="app-field"
        formControlName="description"
        rows="2"
        placeholder="Descripción (opcional)"
      ></textarea>
    </div>
    <button class="app-btn app-btn-primary" type="submit" [disabled]="form.invalid">
      Crear
    </button>
  </form>

  <div *ngIf="loading" class="app-muted">Cargando…</div>
  <div *ngIf="!loading && !items.length" class="app-muted app-fs14">
    Crea un tema y añade pasos desde el editor.
  </div>

  <ul class="app-list">
    <li *ngFor="let t of items" class="app-list-item">
      <button type="button" class="app-list-item-action" (click)="open(t)" style="border: none; flex: 1; display: flex; align-items: center; gap: 12px; padding: 0; border-bottom: none">
        <div class="app-list-body">
          <div class="app-list-name">{{ t.title }}</div>
          <div class="app-list-meta">
            {{ t.steps ? t.steps.length : 0 }} pasos · {{ t.visibility }}
          </div>
        </div>
        <span class="app-list-chev">›</span>
      </button>
      <button
        type="button"
        class="app-btn app-btn-sm app-btn-danger"
        (click)="remove(t, $event)"
      >
        Borrar
      </button>
    </li>
  </ul>
</div>
