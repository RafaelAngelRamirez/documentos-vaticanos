<div class="app">
  <div class="fbar hair">
    <button
      type="button"
      class="back"
      (click)="goLib()"
      aria-label="Volver a la biblioteca"
    >
      ←
    </button>
    <span class="ftitle">Buscar</span>
    <span class="fspacer" aria-hidden="true"></span>
  </div>

  <div class="fbody">
    <!-- Campo simple según handoff 3E (sin chips de ejemplo) -->
    <input
      class="field"
      type="search"
      placeholder="Palabra, frase o intención…"
      [formControl]="control"
      aria-label="Búsqueda en el texto: palabra, frase o intención"
    />
    <p class="fs12 muted search-hint">
      Frases e intenciones valen (p.&nbsp;ej. el amor de Dios). También un
      término (fe) o un punto (.27 · .200-205). Offline, sin red.
    </p>

    <app-buscador></app-buscador>
  </div>
</div>
