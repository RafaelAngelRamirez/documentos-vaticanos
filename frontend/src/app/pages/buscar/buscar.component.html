<div class="app">
  <div class="fbar hair">
    <button
      type="button"
      class="back"
      (click)="goLib()"
      aria-label="Volver a la biblioteca"
    >
      ←
    </button>
    <span class="ftitle">Buscar</span>
    <span class="fspacer" aria-hidden="true"></span>
  </div>

  <div class="fbody">
    <!-- Campo simple según handoff 3E (sin chips de ejemplo) -->
    <input
      class="field"
      type="search"
      placeholder="Buscar"
      [formControl]="control"
      aria-label="Búsqueda en el texto"
    />

    <app-buscador></app-buscador>
  </div>
</div>
