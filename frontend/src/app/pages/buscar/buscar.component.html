<div class="app">
  <div class="fbar hair">
    <button
      type="button"
      class="back"
      (click)="goLib()"
      aria-label="Volver a la biblioteca"
    >
      ←
    </button>
    <span class="ftitle">Buscar</span>
    <span class="fspacer" aria-hidden="true"></span>
  </div>

  <div class="fbody">
    <input
      class="field"
      type="search"
      placeholder="Términos o puntos (.100-105), separados por coma"
      [formControl]="control"
      aria-label="Búsqueda en el texto"
    />

    <div class="exrow" *ngIf="!hasQuery">
      <button
        type="button"
        class="exbtn"
        (click)="runExample('muerte, resurrección')"
      >
        muerte, resurrección
      </button>
      <button
        type="button"
        class="exbtn"
        (click)="runExample('.100-105, .299-300')"
      >
        .100-105, .299-300
      </button>
      <button type="button" class="exbtn" (click)="runExample('esperanza')">
        esperanza
      </button>
    </div>

    <app-buscador></app-buscador>
  </div>
</div>
